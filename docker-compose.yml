---
services:
  yt-llm-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-llm-service:latest
    container_name: yt-llm-service
    restart: unless-stopped
    depends_on:
      llama-cpp:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ports:
      - "8002:8002"
    volumes:
      - ./src:/app/src
      - ./data/tmp:/app/tmp
      - ${HOST_OUTPUT_DIR:-./data/output}:/app/output
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      # Obsidian integration config. Without this mount the service looks for
      # ~/.config/yt-llm/config.toml inside the container, never finds it, and
      # silently disables the vault export no matter what the host config says.
      - ${HOST_YT_LLM_CONFIG:-~/.config/yt-llm}:/home/app/.config/yt-llm:ro
      # The vault is mounted at the SAME absolute path it has on the host,
      # because vault_path in config.toml is resolved inside the container.
      # Keeping the two identical means one path is correct on both sides.
      - ${HOST_OBSIDIAN_VAULT:-/tmp/no-vault}:${HOST_OBSIDIAN_VAULT:-/tmp/no-vault}
      # Optional browser data volumes for YouTube cookie authentication
      # Uncomment and modify paths as needed for your system
      - ${HOST_FIREFOX_DIR:-~/.mozilla/firefox}:/home/app/.mozilla/firefox:ro
      # - ${HOST_CHROME_DIR:-~/.config/google-chrome}:/home/app/.config/google-chrome:ro
    environment:
      - DEVICE=${DEVICE:-cuda}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - BATCH_SIZE=${BATCH_SIZE:-16}
      - HF_TOKEN=${HF_TOKEN:-}
      - TEMP_DIR=/app/tmp
      - OUTPUT_DIR=/app/output
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Lets the service translate /app/output paths back to host paths
      # when recording provenance in Obsidian notes.
      - HOST_OUTPUT_DIR=${HOST_OUTPUT_DIR:-./data/output}
      - TF_CPP_MIN_LOG_LEVEL=2
      - CUDA_VISIBLE_DEVICES=0
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - MPLCONFIGDIR=/home/app/.config/matplotlib
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama-cpp:
    build: ./llama-cpp
    container_name: llama-cpp
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      # yt-llm-service reaches llama-cpp over the compose network
      # (http://llama-cpp:8080), so this host binding exists only for poking at
      # the sidecar by hand. It defaults off 8080 because that port is commonly
      # already taken; set LLAMA_CPP_HOST_PORT to move it.
      - "${LLAMA_CPP_HOST_PORT:-18080}:8080"
    volumes:
      - ./llama-cpp/entrypoint.sh:/entrypoint.sh:ro
      - ./models:/models
    environment:
      - LLAMA_CPP_GPU_LAYERS=${LLAMA_CPP_GPU_LAYERS:-99}
      - LLAMA_CPP_IDLE_SECONDS=${LLAMA_CPP_IDLE_SECONDS:-300}
    deploy:
      resources:
        reservations:
          devices:
            # Both services share GPU 0. gpt-oss-20b MXFP4 (~12GB) and WhisperX
            # large-v3-turbo coexist on a single 24GB card, and llama-cpp
            # unloads after LLAMA_CPP_IDLE_SECONDS anyway. To split them across
            # two GPUs, pin this to ['1'] in a docker-compose.override.yml —
            # see "GPU Setup" in README.md.
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10
