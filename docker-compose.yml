---
services:
  yt-llm-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-llm-service:latest
    container_name: yt-llm-service
    restart: unless-stopped
    depends_on:
      llama-cpp:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ports:
      - "8002:8002"
    volumes:
      - ./src:/app/src
      - ./data/tmp:/app/tmp
      - ${HOST_OUTPUT_DIR:-./data/output}:/app/output
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      # Optional browser data volumes for YouTube cookie authentication
      # Uncomment and modify paths as needed for your system
      - ${HOST_FIREFOX_DIR:-~/.mozilla/firefox}:/home/app/.mozilla/firefox:ro
      # - ${HOST_CHROME_DIR:-~/.config/google-chrome}:/home/app/.config/google-chrome:ro
    environment:
      - DEVICE=${DEVICE:-cuda}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - BATCH_SIZE=${BATCH_SIZE:-16}
      - HF_TOKEN=${HF_TOKEN:-}
      - TEMP_DIR=/app/tmp
      - OUTPUT_DIR=/app/output
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TF_CPP_MIN_LOG_LEVEL=2
      - CUDA_VISIBLE_DEVICES=0
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - MPLCONFIGDIR=/home/app/.config/matplotlib
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama-cpp:
    build: ./llama-cpp
    container_name: llama-cpp
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      - "8080:8080"
    volumes:
      - ./llama-cpp/entrypoint.sh:/entrypoint.sh:ro
      - ./models:/models
    environment:
      - LLAMA_CPP_GPU_LAYERS=${LLAMA_CPP_GPU_LAYERS:-99}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10