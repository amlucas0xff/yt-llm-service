services:
  ocr-poc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-poc
    volumes:
      - ./test_frames:/app/test_frames:ro
      - ./results:/app/results
    environment:
      - CUDA_VISIBLE_DEVICES=0  # maps to physical GPU 1 via device_ids below
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
